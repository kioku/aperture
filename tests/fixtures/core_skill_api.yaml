openapi: 3.0.3
info:
  title: Handbook example API
  version: '1'
servers:
  - url: https://example.invalid
paths:
  /items:
    get:
      tags: [items]
      operationId: listItems
      responses:
        '200':
          description: Items
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      tags: [items]
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Created
  /items/{id}:
    get:
      tags: [items]
      operationId: getItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
